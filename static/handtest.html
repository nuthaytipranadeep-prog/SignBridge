<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hand tracking test</title>
  <style>
    body { font-family: Arial; text-align: center; background: #111; color: white; }
    .box { position: relative; display: inline-block; }
    video, canvas { width: 640px; height: 480px; transform: scaleX(-1); }
    canvas { position: absolute; left: 0; top: 0; }
  </style>
</head>
<body>
  <h2>Hand tracking test</h2>
  <p id="status">Loading model... (needs internet)</p>
  <div class="box">
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="out" width="640" height="480"></canvas>
  </div>

  <script type="module">
    import { HandLandmarker, FilesetResolver, DrawingUtils }
      from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

    const status = document.getElementById("status");
    const video = document.getElementById("cam");
    const canvas = document.getElementById("out");
    const ctx = canvas.getContext("2d");
    const drawing = new DrawingUtils(ctx);

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
    const landmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
      },
      runningMode: "VIDEO",
      numHands: 2
    });

    try {
  video.srcObject = await navigator.mediaDevices.getUserMedia({ video: true });
  await video.play();
} catch (e) {
  status.textContent = "Camera not available: " + e.message;
  throw e;
}
    status.textContent = "Show your hand to the camera";

    function loop() {
      const res = landmarker.detectForVideo(video, performance.now());
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const hand of res.landmarks) {
        drawing.drawConnectors(hand, HandLandmarker.HAND_CONNECTIONS, { color: "#00ff88", lineWidth: 3 });
        drawing.drawLandmarks(hand, { color: "#ff3366", radius: 3 });
      }
      status.textContent = res.landmarks.length + " hand(s) detected";
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
